<style>

<body>

<div class="container">

<div class="header">
<div class="title">🏆 LEADERBOARD</div>

<div class="tabs">
<button class="tab-btn active" id="todayTab">Today</button>
<button class="tab-btn" id="allTimeTab">All-Time</button>
</div>

<div class="search-box">
<input type="text" id="searchInput" placeholder="🔍 Search Player">
<div class="search-results" id="searchResults"></div>
</div>
</div>

<div class="rank-card">
<div class="rank-title">🔥 Your Rank</div>
<div class="rank-line" id="yourRank">
#18 • Joydeep • 4/5 • 2
</div>
</div>

<div class="board">
<div class="board-header" id="boardHeader">
<div>Rank</div>
<div>Name</div>
<div>Score</div>
<div>Today 5/5</div>
</div>

<div id="leaderboardList">
<div class="loading">Loading leaderboard...</div>
</div>
</div>

<div class="share-section">
<button class="share-btn whatsapp" id="waBtn">WhatsApp</button>
<button class="share-btn facebook" id="fbBtn">Facebook</button>
<button class="share-btn copy" id="copyBtn">Copy Link</button>
</div>

<div class="footer-note">
BrainPlay AI • Real vs AI Challenge
</div>

</div>

<script type="module">

import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import {
getFirestore,
collection,
query,
orderBy,
limit,
getDocs
} from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js';

const firebaseConfig = {
apiKey: 'YOUR_API_KEY',
authDomain: 'YOUR_AUTH_DOMAIN',
projectId: 'YOUR_PROJECT_ID',
storageBucket: 'YOUR_STORAGE_BUCKET',
messagingSenderId: 'YOUR_MESSAGING_SENDER_ID',
appId: 'YOUR_APP_ID'
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const leaderboardList = document.getElementById('leaderboardList');
const todayTab = document.getElementById('todayTab');
const allTimeTab = document.getElementById('allTimeTab');
const boardHeader = document.getElementById('boardHeader');
const searchInput = document.getElementById('searchInput');
const searchResults = document.getElementById('searchResults');

let leaderboardData = [];
let currentTab = 'today';

async function loadLeaderboard(type='today') {
leaderboardList.innerHTML = '<div class="loading">Loading leaderboard...</div>';

let leaderboardQuery;

if(type === 'today'){
boardHeader.innerHTML = `
<div>Rank</div>
<div>Name</div>
<div>Score</div>
<div>Today 5/5</div>
`;

leaderboardQuery = query(
collection(db,'real_vs_ai_leaderboard'),
orderBy('todayPerfectScoreCount','desc'),
orderBy('score','desc'),
limit(10)
);

}else{
boardHeader.innerHTML = `
<div>Rank</div>
<div>Name</div>
<div>Score</div>
<div>All-Time</div>
`;

leaderboardQuery = query(
collection(db,'real_vs_ai_leaderboard'),
orderBy('allTimePerfectScoreCount','desc'),
orderBy('score','desc'),
limit(10)
);
}

const snapshot = await getDocs(leaderboardQuery);

leaderboardData = [];

snapshot.forEach(doc=>{
leaderboardData.push(doc.data());
});

renderLeaderboard(type);
}

function renderLeaderboard(type){
leaderboardList.innerHTML = '';

leaderboardData.forEach((player,index)=>{

let medal = `${index+1}.`;

if(index===0) medal='🥇';
if(index===1) medal='🥈';
if(index===2) medal='🥉';

const row = document.createElement('div');
row.className='player-row';

row.innerHTML = `
<div class="rank">${medal}</div>
<div class="name">${player.username}</div>
<div class="score">${player.score || '0/5'}</div>
<div class="perfect">
${type==='today'
? player.todayPerfectScoreCount || 0
: player.allTimePerfectScoreCount || 0}
</div>
`;

leaderboardList.appendChild(row);
});
}

function searchPlayers(){
const value = searchInput.value.toLowerCase();

if(value.length===0){
searchResults.style.display='none';
return;
}

const filtered = leaderboardData.filter(player=>
player.username.toLowerCase().includes(value)
);

searchResults.innerHTML='';
searchResults.style.display='block';

if(filtered.length===0){
searchResults.innerHTML='<div>No player found</div>';
return;
}

filtered.forEach((player,index)=>{
const item = document.createElement('div');
item.style.padding='10px 0';
item.style.borderBottom='1px solid rgba(255,255,255,0.06)';

item.innerHTML=`
#${index+1} • ${player.username} • ${player.score || '0/5'} •
${currentTab==='today'
? player.todayPerfectScoreCount || 0
: player.allTimePerfectScoreCount || 0}
`;

searchResults.appendChild(item);
});
}

todayTab.addEventListener('click',()=>{
currentTab='today';
todayTab.classList.add('active');
allTimeTab.classList.remove('active');
loadLeaderboard('today');
});

allTimeTab.addEventListener('click',()=>{
currentTab='alltime';
allTimeTab.classList.add('active');
todayTab.classList.remove('active');
loadLeaderboard('alltime');
});

searchInput.addEventListener('input',searchPlayers);

function shareWhatsApp(){
const text='🔥 I scored 5/5 on BrainPlay AI. Can you beat me? https://brainplayai.in';
window.open(`https://wa.me/?text=${encodeURIComponent(text)}`);
}

function shareFacebook(){
const url='https://brainplayai.in';
window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`);
}

function copyLink(){
navigator.clipboard.writeText('https://brainplayai.in');
alert('Link copied!');
}

document.getElementById('waBtn').addEventListener('click',shareWhatsApp);
document.getElementById('fbBtn').addEventListener('click',shareFacebook);
document.getElementById('copyBtn').addEventListener('click',copyLink);

loadLeaderboard();

</script>

</body>
</html>
