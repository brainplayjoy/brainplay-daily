<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>BrainPlay AI | Leaderboard</title>
    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDgAH9ZbCy5Rbq2F9TgZmv91EJYjxeP2-I",
            authDomain: "brainplay-ai-2a121.firebaseapp.com",
            projectId: "brainplay-ai-2a121",
            storageBucket: "brainplay-ai-2a121.firebasestorage.app",
            messagingSenderId: "35432555119",
            appId: "1:35432555119:web:a599cf8285142a8d40a39a",
            measurementId: "G-1DZC73CV6V"
        };
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.db = db;
        window.getFirestore = () => db;
        
        const USERS_COLLECTION = "leaderboard_users";
        
        function getNameFromEmail(email) {
            if (!email) return "Player";
            const localPart = email.split('@')[0];
            return localPart.charAt(0).toUpperCase() + localPart.slice(1);
        }
        
        async function seedDemoUsers() {
            const usersRef = collection(db, USERS_COLLECTION);
            const snapshot = await getDocs(usersRef);
            if (!snapshot.empty) return;
            
            const demoList = [
                { name: "Alex Johnson", email: "alex.j@example.com" },
                { name: "Emma Williams", email: "emma.w@example.com" },
                { name: "Ryan Garcia", email: "ryan.g@example.com" },
                { name: "Noah Martinez", email: "noah.m@example.com" },
                { name: "Liam Brown", email: "liam.b@example.com" },
                { name: "Sophia Davis", email: "sophia.d@example.com" },
                { name: "Mason Wilson", email: "mason.w@example.com" },
                { name: "Isabella Moore", email: "isabella.m@example.com" },
                { name: "Ethan Taylor", email: "ethan.t@example.com" },
                { name: "Mia Anderson", email: "mia.a@example.com" },
                { name: "Priya Sharma", email: "priya.s@example.com" },
                { name: "Arjun Mehta", email: "arjun.m@example.com" },
                { name: "Ananya Verma", email: "ananya.v@example.com" },
                { name: "Rohan Kapoor", email: "rohan.k@example.com" },
                { name: "Neha Gupta", email: "neha.g@example.com" },
                { name: "James Rodriguez", email: "james.r@example.com" },
                { name: "Olivia Smith", email: "olivia.s@example.com" },
                { name: "Benjamin Lee", email: "ben.l@example.com" },
                { name: "Charlotte Clark", email: "charlotte.c@example.com" },
                { name: "Daniel Lewis", email: "daniel.l@example.com" }
            ];
            
            const todayStr = new Date().toISOString().slice(0,10);
            for (let i = 0; i < demoList.length; i++) {
                const user = demoList[i];
                const todayPerfect = Math.floor(Math.random() * 7);
                const allTimePerfect = Math.floor(Math.random() * 26);
                const userData = {
                    name: user.name,
                    email: user.email,
                    todayPerfectCount: todayPerfect,
                    allTimePerfectCount: allTimePerfect,
                    lastResetDate: todayStr,
                    createdAt: new Date().toISOString()
                };
                await setDoc(doc(db, USERS_COLLECTION, user.email), userData);
            }
            console.log("Demo users seeded");
        }
        
        async function resetTodayCountsIfNeeded() {
            const todayStr = new Date().toISOString().slice(0,10);
            const usersRef = collection(db, USERS_COLLECTION);
            const snapshot = await getDocs(usersRef);
            for (const docSnap of snapshot.docs) {
                const data = docSnap.data();
                const lastReset = data.lastResetDate || "";
                if (lastReset !== todayStr) {
                    await updateDoc(doc(db, USERS_COLLECTION, docSnap.id), {
                        todayPerfectCount: 0,
                        lastResetDate: todayStr
                    });
                }
            }
        }
        
        // Unified leaderboard: sort by allTimePerfectCount desc, then todayPerfectCount desc
        async function fetchLeaderboardData() {
            const usersRef = collection(db, USERS_COLLECTION);
            const snapshot = await getDocs(usersRef);
            const users = [];
            snapshot.forEach(docSnap => {
                const data = docSnap.data();
                users.push({
                    email: docSnap.id,
                    name: data.name || getNameFromEmail(docSnap.id),
                    todayPerfectCount: data.todayPerfectCount || 0,
                    allTimePerfectCount: data.allTimePerfectCount || 0
                });
            });
            users.sort((a,b) => {
                if (a.allTimePerfectCount !== b.allTimePerfectCount) return b.allTimePerfectCount - a.allTimePerfectCount;
                return b.todayPerfectCount - a.todayPerfectCount;
            });
            return users;
        }
        
        function getCurrentUser() {
            const email = localStorage.getItem('brainplay_user_email');
            if (email) return { email, name: getNameFromEmail(email) };
            return null;
        }
        
        async function loginUser(email) {
            if (!email || !email.includes('@')) throw new Error("Valid email required");
            const normalized = email.toLowerCase();
            const userRef = doc(db, USERS_COLLECTION, normalized);
            const userSnap = await getDoc(userRef);
            const todayStr = new Date().toISOString().slice(0,10);
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    name: getNameFromEmail(normalized),
                    email: normalized,
                    todayPerfectCount: 0,
                    allTimePerfectCount: 0,
                    lastResetDate: todayStr,
                    createdAt: new Date().toISOString()
                });
            } else {
                const existing = userSnap.data();
                if (existing.lastResetDate !== todayStr) {
                    await updateDoc(userRef, { todayPerfectCount: 0, lastResetDate: todayStr });
                }
            }
            localStorage.setItem('brainplay_user_email', normalized);
            return { email: normalized, name: getNameFromEmail(normalized) };
        }
        
        function logoutUser() {
            localStorage.removeItem('brainplay_user_email');
            location.reload();
        }
        
        window.loginUser = loginUser;
        window.logoutUser = logoutUser;
        window.getCurrentUser = getCurrentUser;
        window.fetchLeaderboardData = fetchLeaderboardData;
        window.seedDemoUsers = seedDemoUsers;
        window.resetTodayCountsIfNeeded = resetTodayCountsIfNeeded;
        
        window.initLeaderboard = async () => {
            await resetTodayCountsIfNeeded();
            await seedDemoUsers();
            renderLeaderboardUI();
        };
        
        window.renderLeaderboardUI = async () => {
            const users = await fetchLeaderboardData();
            const currentUser = getCurrentUser();
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            
            let filteredUsers = users;
            if (searchTerm) {
                filteredUsers = users.filter(u => u.name.toLowerCase().includes(searchTerm));
            }
            
            let currentUserRankData = null;
            if (currentUser) {
                const idx = filteredUsers.findIndex(u => u.email === currentUser.email);
                if (idx !== -1) {
                    currentUserRankData = { rank: idx+1, user: filteredUsers[idx] };
                }
            }
            
            let mainList = filteredUsers;
            if (currentUserRankData) {
                mainList = filteredUsers.filter(u => u.email !== currentUser.email);
            }
            
            const tbody = document.getElementById('leaderboardBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            // Your Rank section (always at top)
            if (currentUserRankData) {
                const yourRow = document.createElement('tr');
                yourRow.className = 'your-rank-row';
                let rankDisplay = '';
                const r = currentUserRankData.rank;
                if (r === 1) rankDisplay = '🥇';
                else if (r === 2) rankDisplay = '🥈';
                else if (r === 3) rankDisplay = '🥉';
                else rankDisplay = `#${r}`;
                
                const scoreCount = currentUserRankData.user.allTimePerfectCount;
                const scoreLabel = 'All-Time 5/5';
                yourRow.innerHTML = `
                    <td class="rank-cell">${rankDisplay}</td>
                    <td class="name-cell">${currentUserRankData.user.name} <span class="you-badge">(You)</span></td>
                    <td class="score-cell">${scoreCount}× ${scoreLabel}</td>
                `;
                tbody.appendChild(yourRow);
                // separator line (blue horizontal line)
                const sep = document.createElement('tr');
                sep.className = 'separator-row';
                sep.innerHTML = '<td colspan="3"><div class="sep-line"></div></td>';
                tbody.appendChild(sep);
            }
            
            // Main leaderboard list
            mainList.forEach((user, idx) => {
                const globalRank = currentUserRankData ? idx + 1 : idx + 1;
                let rankDisplay = '';
                if (globalRank === 1) rankDisplay = '🥇';
                else if (globalRank === 2) rankDisplay = '🥈';
                else if (globalRank === 3) rankDisplay = '🥉';
                else rankDisplay = `#${globalRank}`;
                
                const scoreCount = user.allTimePerfectCount;
                const scoreLabel = 'All-Time 5/5';
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td class="rank-cell">${rankDisplay}</td>
                    <td class="name-cell">${user.name}</td>
                    <td class="score-cell">${scoreCount}× ${scoreLabel}</td>
                `;
                tbody.appendChild(row);
            });
            
            if (mainList.length === 0 && !currentUserRankData) {
                tbody.innerHTML = '<tr><td colspan="3" class="empty-row">No players found 🔍</td></tr>';
            }
            
            // Toggle join button / logged user display
            const joinBtn = document.getElementById('joinNowBtn');
            const userDisplaySpan = document.getElementById('loggedUserDisplay');
            if (currentUser) {
                if (joinBtn) joinBtn.style.display = 'none';
                if (userDisplaySpan) {
                    userDisplaySpan.style.display = 'inline-flex';
                    userDisplaySpan.innerHTML = `👋 ${currentUser.name} <button id="logoutBtnSmall" class="logout-mini">🚪</button>`;
                    const logoutMini = document.getElementById('logoutBtnSmall');
                    if (logoutMini) logoutMini.onclick = (e) => { e.stopPropagation(); logoutUser(); };
                }
            } else {
                if (joinBtn) joinBtn.style.display = 'flex';
                if (userDisplaySpan) userDisplaySpan.style.display = 'none';
            }
        };
        
        window.addEventListener('DOMContentLoaded', async () => {
            await initLeaderboard();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => renderLeaderboardUI());
            }
            // Modal logic
            const modal = document.getElementById('loginModal');
            const joinBtn = document.getElementById('joinNowBtn');
            const closeModal = document.getElementById('closeModal');
            const saveEmailBtn = document.getElementById('saveEmailBtn');
            const emailInput = document.getElementById('loginEmail');
            
            if (joinBtn) {
                joinBtn.addEventListener('click', () => {
                    if (modal) modal.style.display = 'flex';
                });
            }
            if (closeModal) {
                closeModal.addEventListener('click', () => { if(modal) modal.style.display = 'none'; });
            }
            if (saveEmailBtn && emailInput) {
                saveEmailBtn.addEventListener('click', async () => {
                    const email = emailInput.value.trim();
                    if (!email || !email.includes('@')) {
                        alert("Please enter a valid email address");
                        return;
                    }
                    try {
                        await loginUser(email);
                        if (modal) modal.style.display = 'none';
                        emailInput.value = '';
                        renderLeaderboardUI();
                    } catch(err) { alert("Error: "+err.message); }
                });
            }
            window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
        });
    </script>
    
    <style>

        .your-rank-row {

        .you-badge {

        .play-again-btn:hover { background: #ffea70; transform: translateY(-2px);}
        
        /* Modal - Clean professional close button at top-right */

            outline: none;

            background: #FDDA0D;

        @media (max-width: 480px) {
            .leaderboard-container { padding: 16px; }
            .title-section h1 { font-size: 24px; }
            .rank-cell { width: 55px; }
        }
    </style>
</head>
<body>
<div class="leaderboard-container">
    <div class="leaderboard-header">
        <div class="title-section">
            <h1><span>🏆</span> LEADERBOARD</h1>
            <p>Top players • Real vs AI challenge</p>
        </div>
        <div class="hamburger-menu-leader">
            <button class="hamburger-icon" id="menuToggle">☰</button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="https://brainplayai.in/">Home</a>
                <a href="https://brainplayai.in/how-to-play.html">How to Play</a>
                <a href="#" id="logoutMenuBtn">🚪 Logout</a>
            </div>
        </div>
    </div>
    
    <div class="user-action-area">
        <span class="check-rank-text">👑 Check your rank</span>
        <button id="joinNowBtn" class="join-now-btn">🔗 Join Now</button>
        <span id="loggedUserDisplay" style="display: none;" class="logged-user-badge"></span>
    </div>
    
    <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Search player...">
    </div>
    
    <div style="overflow-x: auto;">
        <table class="leaderboard-table">
            <thead>
                <tr><th>Rank</th><th>Player</th><th style="text-align: right;">Score</th></tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="3" style="text-align:center; padding:40px;">Loading leaderboard...</td></tr>
            </tbody>
        </table>
    </div>
    
    <div class="play-again-wrapper">
        <button class="play-again-btn" id="playAgainBtn">▶ Play</button>
    </div>
</div>

<!-- Login Modal with polished design: close button at top-right -->
<div id="loginModal" class="modal">
    <div class="modal-card">
        <button class="modal-close" id="closeModal">×</button>
        <h3>✨ Join Now</h3>
        <p>Enter your email to compete on leaderboard</p>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        <button id="saveEmailBtn">Save & Continue</button>
    </div>
</div>

<script type="module">
    // Hamburger & dynamic menu controls
    const menuToggle = document.getElementById('menuToggle');
    const dropdown = document.getElementById('dropdownMenu');
    if (menuToggle && dropdown) {
        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (!menuToggle.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });
    }
    const logoutMenu = document.getElementById('logoutMenuBtn');
    if (logoutMenu) {
        logoutMenu.addEventListener('click', (e) => {
            e.preventDefault();
            if (typeof window.logoutUser === 'function') window.logoutUser();
        });
    }
    const playAgain = document.getElementById('playAgainBtn');
    if (playAgain) {
        playAgain.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    }
    window.renderLeaderboardUI = window.renderLeaderboardUI;
</script>
</body>
</html>
