        function getNameFromEmail(email) {
            if (!email) return "Player";
            const localPart = email.split('@')[0];
            return localPart.charAt(0).toUpperCase() + localPart.slice(1);
        }
        
        // ========== MIGRATION: ensure totalPlayedCount field exists ==========
        async function ensureTotalPlayedCountField(userRef, currentData) {
            if (currentData.totalPlayedCount === undefined) {
                const perfect = currentData.allTimePerfectCount || 0;
                let newTotal = perfect + Math.floor(Math.random() * 5) + 1;
                if (newTotal < perfect) newTotal = perfect;
                await updateDoc(userRef, { totalPlayedCount: newTotal });
                return newTotal;
            }
            return currentData.totalPlayedCount;
        }

        async function resetTodayCountsIfNeeded() {
            const todayStr = new Date().toISOString().slice(0,10);
            const usersRef = collection(db, USERS_COLLECTION);
            const snapshot = await getDocs(usersRef);
            for (const docSnap of snapshot.docs) {
                const data = docSnap.data();
                const lastReset = data.lastResetDate || "";
                if (lastReset !== todayStr) {
                    await updateDoc(doc(db, USERS_COLLECTION, docSnap.id), {
                        todayPerfectCount: 0,
                        lastResetDate: todayStr
                    });
                }
            }
        }
        
        // fetch users with computed stats: P (total plays), perfectCount, zeroCount, win%
        async function fetchLeaderboardData() {
            const usersRef = collection(db, USERS_COLLECTION);
            const snapshot = await getDocs(usersRef);
            const users = [];
            
            for (const docSnap of snapshot.docs) {
                const data = docSnap.data();
                let totalPlayed = data.totalPlayedCount;
                if (totalPlayed === undefined) {
                    const perfectCount = data.allTimePerfectCount || 0;
                    totalPlayed = perfectCount + Math.floor(Math.random() * 5) + 1;
                    if (totalPlayed < perfectCount) totalPlayed = perfectCount;
                    updateDoc(doc(db, USERS_COLLECTION, docSnap.id), { totalPlayedCount: totalPlayed }).catch(e => console.warn);
                }
                const perfectCount = data.allTimePerfectCount || 0;
                const played = totalPlayed || perfectCount;
                const zeroCount = Math.max(0, played - perfectCount);
                const winPercent = played === 0 ? 0 : (perfectCount / played) * 100;
                
                users.push({
                    email: docSnap.id,
                    name: data.name || getNameFromEmail(docSnap.id),
                    todayPerfectCount: data.todayPerfectCount || 0,
                    allTimePerfectCount: perfectCount,
                    totalPlayedCount: played,
                    zeroFiveCount: zeroCount,
                    winPercent: winPercent
                });
            }
            users.sort((a,b) => {
                if (a.winPercent !== b.winPercent) return b.winPercent - a.winPercent;
                if (a.allTimePerfectCount !== b.allTimePerfectCount) return b.allTimePerfectCount - a.allTimePerfectCount;
                return b.totalPlayedCount - a.totalPlayedCount;
            });
            return users;
        }
        
        function assignDenseRank(usersSorted) {
            let rank = 1;
            for (let i = 0; i < usersSorted.length; i++) {
                const current = usersSorted[i];
                if (i === 0) {
                    current.rank = rank;
                } else {
                    const prev = usersSorted[i-1];
                    const sameWin = Math.abs(prev.winPercent - current.winPercent) < 0.0001;
                    const samePerfect = prev.allTimePerfectCount === current.allTimePerfectCount;
                    if (sameWin && samePerfect) {
                        current.rank = prev.rank;
                    } else {
                        rank = i + 1;
                        current.rank = rank;
                    }
                }
            }
            return usersSorted;
        }
        
        function getCurrentUser() {
            const email = localStorage.getItem('brainplay_user_email');
            if (email) return { email, name: getNameFromEmail(email) };
            return null;
        }
        
        async function loginUser(email) {
            if (!email || !email.includes('@')) throw new Error("Valid email required");
            const normalized = email.toLowerCase();
            const userRef = doc(db, USERS_COLLECTION, normalized);
            const userSnap = await getDoc(userRef);
            const todayStr = new Date().toISOString().slice(0,10);
            if (!userSnap.exists()) {
                await setDoc(userRef, {
                    name: getNameFromEmail(normalized),
                    email: normalized,
                    todayPerfectCount: 0,
                    allTimePerfectCount: 0,
                    totalPlayedCount: 0,
                    lastResetDate: todayStr,
                    createdAt: new Date().toISOString()
                });
            } else {
                const existing = userSnap.data();
                if (existing.totalPlayedCount === undefined) {
                    const perfect = existing.allTimePerfectCount || 0;
                    const newTotal = perfect + Math.floor(Math.random() * 3) + 1;
                    await updateDoc(userRef, { totalPlayedCount: newTotal });
                }
                if (existing.lastResetDate !== todayStr) {
                    await updateDoc(userRef, { todayPerfectCount: 0, lastResetDate: todayStr });
                }
            }
            localStorage.setItem('brainplay_user_email', normalized);
            return { email: normalized, name: getNameFromEmail(normalized) };
        }
        
        function logoutUser() {
            localStorage.removeItem('brainplay_user_email');
            location.reload();
        }
        
        window.loginUser = loginUser;
        window.logoutUser = logoutUser;
        window.getCurrentUser = getCurrentUser;
        window.fetchLeaderboardData = fetchLeaderboardData;
        window.seedDemoUsers = seedDemoUsers;
        window.resetTodayCountsIfNeeded = resetTodayCountsIfNeeded;
        
        window.initLeaderboard = async () => {
            await resetTodayCountsIfNeeded();
            await seedDemoUsers();
            renderLeaderboardUI();
        };
        
        window.renderLeaderboardUI = async () => {
            const allUsers = await fetchLeaderboardData();
            const rankedAllUsers = assignDenseRank([...allUsers]);
            
            const currentUser = getCurrentUser();
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            
            let currentUserGlobalData = null;
            if (currentUser) {
                currentUserGlobalData = rankedAllUsers.find(u => u.email === currentUser.email);
            }
            
            let filteredUsers = [...rankedAllUsers];
            if (searchTerm) {
                filteredUsers = filteredUsers.filter(u => u.name.toLowerCase().includes(searchTerm));
            }
            
            if (currentUserGlobalData) {
                filteredUsers = filteredUsers.filter(u => u.email !== currentUser.email);
            }
            
            const filteredSorted = assignDenseRank([...filteredUsers]);
            
            const tbody = document.getElementById('leaderboardBody');
            if (!tbody) return;
            tbody.innerHTML = '';
            
            // YOUR RANK SECTION
            if (currentUserGlobalData) {
                const yourRow = document.createElement('tr');
                yourRow.className = 'your-rank-row';
                let rankDisplay = '';
                const globalRankNum = currentUserGlobalData.rank;
                if (globalRankNum === 1) rankDisplay = '🥇';
                else if (globalRankNum === 2) rankDisplay = '🥈';
                else if (globalRankNum === 3) rankDisplay = '🥉';
                else rankDisplay = `#${globalRankNum}`;
                
                const played = currentUserGlobalData.totalPlayedCount;
                const perfect = currentUserGlobalData.allTimePerfectCount;
                const zero = currentUserGlobalData.zeroFiveCount;
                const winPct = currentUserGlobalData.winPercent.toFixed(2);
                
                yourRow.innerHTML = `
                    <td class="rank-cell">${rankDisplay}</td>
                    <td class="name-cell">${currentUserGlobalData.name} <span class="you-badge">(You)</span></td>
                    <td class="stat-cell">${played}</td>
                    <td class="stat-cell">${perfect}</td>
                    <td class="stat-cell">${zero}</td>
                    <td class="stat-cell win-pct">${winPct}%</td>
                `;
                tbody.appendChild(yourRow);
                const sep = document.createElement('tr');
                sep.className = 'separator-row';
                sep.innerHTML = '<td colspan="6"><div class="sep-line"></div></td>';
                tbody.appendChild(sep);
            }
            
            // MAIN LEADERBOARD LIST
            if (filteredSorted.length === 0 && !currentUserGlobalData) {
                tbody.innerHTML += '<tr><td colspan="6" class="empty-row">No players found 🔍</td></tr>';
            } else {
                filteredSorted.forEach(user => {
                    let rankDisplay = '';
                    const rankValue = user.rank;
                    if (rankValue === 1) rankDisplay = '🥇';
                    else if (rankValue === 2) rankDisplay = '🥈';
                    else if (rankValue === 3) rankDisplay = '🥉';
                    else rankDisplay = `#${rankValue}`;
                    
                    const winPctFormatted = user.winPercent.toFixed(2);
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="rank-cell">${rankDisplay}</td>
                        <td class="name-cell">${user.name}</td>
                        <td class="stat-cell">${user.totalPlayedCount}</td>
                        <td class="stat-cell">${user.allTimePerfectCount}</td>
                        <td class="stat-cell">${user.zeroFiveCount}</td>
                        <td class="stat-cell win-pct">${winPctFormatted}%</td>
                    `;
                    tbody.appendChild(row);
                });
            }
            
            // toggle join button
            const joinBtn = document.getElementById('joinNowBtn');
            const userDisplaySpan = document.getElementById('loggedUserDisplay');
            if (currentUser) {
                if (joinBtn) joinBtn.style.display = 'none';
                if (userDisplaySpan) {
                    userDisplaySpan.style.display = 'inline-flex';
                    userDisplaySpan.innerHTML = `👋 ${currentUser.name} <button id="logoutBtnSmall" class="logout-mini">🚪</button>`;
                    const logoutMini = document.getElementById('logoutBtnSmall');
                    if (logoutMini) logoutMini.onclick = (e) => { e.stopPropagation(); logoutUser(); };
                }
            } else {
                if (joinBtn) joinBtn.style.display = 'flex';
                if (userDisplaySpan) userDisplaySpan.style.display = 'none';
            }
        };
        
        window.addEventListener('DOMContentLoaded', async () => {
            await initLeaderboard();
            const searchInput = document.getElementById('searchInput');
            if (searchInput) {
                searchInput.addEventListener('input', () => renderLeaderboardUI());
            }
            // Modal logic
            const modal = document.getElementById('loginModal');
            const joinBtn = document.getElementById('joinNowBtn');
            const closeModal = document.getElementById('closeModal');
            const saveEmailBtn = document.getElementById('saveEmailBtn');
            const emailInput = document.getElementById('loginEmail');
            
            if (joinBtn) {
                joinBtn.addEventListener('click', () => {
                    if (modal) modal.style.display = 'flex';
                });
            }
            if (closeModal) {
                closeModal.addEventListener('click', () => { if(modal) modal.style.display = 'none'; });
            }
            if (saveEmailBtn && emailInput) {
                saveEmailBtn.addEventListener('click', async () => {
                    const email = emailInput.value.trim();
                    if (!email || !email.includes('@')) {
                        alert("Please enter a valid email address");
                        return;
                    }
                    try {
                        await loginUser(email);
                        if (modal) modal.style.display = 'none';
                        emailInput.value = '';
                        renderLeaderboardUI();
                    } catch(err) { alert("Error: "+err.message); }
                });
            }
            window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
        });
    </script>

            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(8px);
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-card {
            background: #16162e;
            border-radius: 36px;
            max-width: 340px;
            width: 90%;
            padding: 34px 22px 28px;
            position: relative;
            border: 1px solid rgba(255,215,0,0.5);
            box-shadow: 0 20px 35px black;
        }
        .modal-close {
            position: absolute;
            top: 14px;
            right: 16px;
            background: transparent !important;
            border: none !important;
            padding: 0 !important;
            margin: 0 !important;
            color: #ffffff !important;
            font-size: 22px;
            cursor: pointer;
        }
        .modal-card button:not(.modal-close) {
            width: 100%;
            background: #FDDA0D;
            border: none;
            padding: 12px;
            border-radius: 60px;
            font-weight: 800;
            cursor: pointer;
            font-size: 16px;
            color: #000;
        }
        .modal-card h3 {
            font-size: 24px;
            margin-bottom: 8px;
            color: white;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-card p {
            font-size: 14px;
            color: #ccc;
            margin-bottom: 20px;
        }
        .modal-card input {
            width: 100%;
            padding: 14px 16px;
            border-radius: 60px;
            border: none;
            background: #252545;
            color: white;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }
        
        @media (max-width: 680px) {
            .leaderboard-container { padding: 16px; max-width: 100%; }
            .stat-cell, .rank-cell, .name-cell { font-size: 12px; padding: 8px 4px; }
            .leaderboard-table th { font-size: 11px; padding: 8px 4px; }
            .search-and-play-row { gap: 8px; }
            .search-box { max-width: 65%; }
            .play-again-small { padding: 6px 14px; font-size: 12px; }
            .leaderboard-table-wrapper { max-height: 520px; }
            .share-btn { padding: 7px 16px; font-size: 13px; }
        }
        @media (max-width: 550px) {
            .stat-cell { font-size: 11px; }
            .you-badge { font-size: 8px; margin-left: 4px; }
            .play-again-small { padding: 5px 12px; font-size: 11px; }
        }
    </style>
</head>
<body>
<div class="leaderboard-container">
    <div class="leaderboard-header">
        <div class="title-section">
            <h1><span>🏆</span> LEADERBOARD</h1>
            <p>Top players • Real vs AI challenge</p>
        </div>
        <div class="hamburger-menu-leader">
            <button class="hamburger-icon" id="menuToggle">☰</button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="https://brainplayai.in/">Home</a>
                <a href="https://brainplayai.in/how-to-play.html">How to Play</a>
                <a href="#" id="logoutMenuBtn">🚪 Logout</a>
            </div>
        </div>
    </div>
    
    <div class="user-action-area">
        <span class="check-rank-text">👑 Check your rank</span>
        <button id="joinNowBtn" class="join-now-btn">🔗 Join Now</button>
        <span id="loggedUserDisplay" style="display: none;" class="logged-user-badge"></span>
    </div>
    
    <!-- NEW: Search row + Play Again button (yellow, reduced search length) -->
    <div class="search-and-play-row">
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="searchInput" placeholder="Search player...">
        </div>
        <button class="play-again-small" id="playAgainBtnSmall">▶ Play Again</button>
    </div>
    
    <!-- Scrollable table wrapper (max 21 players, then scroll) -->
    <div class="leaderboard-table-wrapper">
        <table class="leaderboard-table">
            <thead>
                <tr>
                    <th>Rank</th>
                    <th>Player</th>
                    <th style="text-align: right;">P</th>
                    <th style="text-align: right;">5/5</th>
                    <th style="text-align: right;">0/5</th>
                    <th style="text-align: right;">W%</th>
                </tr>
            </thead>
            <tbody id="leaderboardBody">
                <tr><td colspan="6" style="text-align:center; padding:40px;">Loading leaderboard...</td></tr>
            </tbody>
        </table>
    </div>
    
    <!-- Brainplay AI text (below leaderboard section) -->
    <div class="brainplay-ai-brand">
        ⚡ BRAINPLAY AI ⚡
    </div>
    
    <!-- Share buttons + website address -->
    <div class="share-footer">
        <div class="share-buttons">
            <button class="share-btn fb" id="shareFacebookBtn"><i class="fab fa-facebook-f"></i> Facebook</button>
            <button class="share-btn whatsapp" id="shareWhatsappBtn"><i class="fab fa-whatsapp"></i> WhatsApp</button>
        </div>
        <div class="website-link">
            🌐 <a href="https://www.brainplayai.in" target="_blank">www.brainplayai.in</a>
        </div>
    </div>
</div>

<!-- Login Modal -->
<div id="loginModal" class="modal">
    <div class="modal-card">
        <button class="modal-close" id="closeModal">×</button>
        <h3>✨ Join Now</h3>
        <p>Enter your email to compete on leaderboard</p>
        <input type="email" id="loginEmail" placeholder="you@example.com" autocomplete="email">
        <button id="saveEmailBtn">Save & Continue</button>
    </div>
</div>

<script type="module">
    // Menu toggle & logout
    const menuToggle = document.getElementById('menuToggle');
    const dropdown = document.getElementById('dropdownMenu');
    if (menuToggle && dropdown) {
        menuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            dropdown.classList.toggle('show');
        });
        document.addEventListener('click', (e) => {
            if (!menuToggle.contains(e.target) && !dropdown.contains(e.target)) {
                dropdown.classList.remove('show');
            }
        });
    }
    const logoutMenu = document.getElementById('logoutMenuBtn');
    if (logoutMenu) {
        logoutMenu.addEventListener('click', (e) => {
            e.preventDefault();
            if (typeof window.logoutUser === 'function') window.logoutUser();
        });
    }
    
    // NEW Play Again button (beside search)
    const playAgainSmall = document.getElementById('playAgainBtnSmall');
    if (playAgainSmall) {
        playAgainSmall.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    }
    
    // Share functionality
    const shareFb = document.getElementById('shareFacebookBtn');
    const shareWa = document.getElementById('shareWhatsappBtn');
    const currentUrl = encodeURIComponent(window.location.href);
    const shareText = encodeURIComponent("Check out the BrainPlay AI Leaderboard! 🧠🏆 Can you beat the best?");
    if (shareFb) {
        shareFb.addEventListener('click', () => {
            window.open(`https://www.facebook.com/sharer/sharer.php?u=${currentUrl}`, '_blank', 'width=600,height=400');
        });
    }
    if (shareWa) {
        shareWa.addEventListener('click', () => {
            window.open(`https://api.whatsapp.com/send?text=${shareText}%20${currentUrl}`, '_blank');
        });
    }
</script>
</body>
</html>
