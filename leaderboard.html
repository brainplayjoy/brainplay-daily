<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=yes">
    <title>BrainPlay AI | Leaderboard</title>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDgAH9ZbCy5Rbq2F9TgZmv91EJYjxeP2-I",
            authDomain: "brainplay-ai-2a121.firebaseapp.com",
            projectId: "brainplay-ai-2a121",
            storageBucket: "brainplay-ai-2a121.firebasestorage.app",
            messagingSenderId: "35432555119",
            appId: "1:35432555119:web:a599cf8285142a8d40a39a",
            measurementId: "G-1DZC73CV6V"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.db = db;
        window.getFirestore = () => db;

        const USERS_COLLECTION = "leaderboard_users";

        function getNameFromEmail(email) {
            if (!email) return "Player";
            const localPart = email.split('@')[0];
            return localPart.charAt(0).toUpperCase() + localPart.slice(1);
        }

        async function seedDemoUsers() {
            const usersRef = collection(db, USERS_COLLECTION);
            const snapshot = await getDocs(usersRef);
            if (!snapshot.empty) return;

            const demoList = [
                { name: "Alex Johnson", email: "alex.j@example.com" },
                { name: "Emma Williams", email: "emma.w@example.com" },
                { name: "Ryan Garcia", email: "ryan.g@example.com" },
                { name: "Noah Martinez", email: "noah.m@example.com" },
                { name: "Liam Brown", email: "liam.b@example.com" },
                { name: "Sophia Davis", email: "sophia.d@example.com" },
                { name: "Mason Wilson", email: "mason.w@example.com" },
                { name: "Isabella Moore", email: "isabella.m@example.com" },
                { name: "Ethan Taylor", email: "ethan.t@example.com" },
                { name: "Mia Anderson", email: "mia.a@example.com" }
            ];

            const todayStr = new Date().toISOString().slice(0,10);

            for (let i = 0; i < demoList.length; i++) {
                const user = demoList[i];

                await setDoc(doc(db, USERS_COLLECTION, user.email), {
                    name: user.name,
                    email: user.email,
                    todayPerfectCount: Math.floor(Math.random() * 7),
                    allTimePerfectCount: Math.floor(Math.random() * 26),
                    lastResetDate: todayStr,
                    createdAt: new Date().toISOString()
                });
            }
        }

        async function resetTodayCountsIfNeeded() {
            const todayStr = new Date().toISOString().slice(0,10);

            const usersRef = collection(db, USERS_COLLECTION);
            const snapshot = await getDocs(usersRef);

            for (const docSnap of snapshot.docs) {
                const data = docSnap.data();
                const lastReset = data.lastResetDate || "";

                if (lastReset !== todayStr) {
                    await updateDoc(doc(db, USERS_COLLECTION, docSnap.id), {
                        todayPerfectCount: 0,
                        lastResetDate: todayStr
                    });
                }
            }
        }

        async function fetchLeaderboardData() {
            const usersRef = collection(db, USERS_COLLECTION);
            const snapshot = await getDocs(usersRef);

            const users = [];

            snapshot.forEach(docSnap => {
                const data = docSnap.data();

                users.push({
                    email: docSnap.id,
                    name: data.name || getNameFromEmail(docSnap.id),
                    todayPerfectCount: data.todayPerfectCount || 0,
                    allTimePerfectCount: data.allTimePerfectCount || 0
                });
            });

            users.sort((a,b) => {
                if (a.allTimePerfectCount !== b.allTimePerfectCount) {
                    return b.allTimePerfectCount - a.allTimePerfectCount;
                }
                return b.todayPerfectCount - a.todayPerfectCount;
            });

            return users;
        }

        function getCurrentUser() {
            const email = localStorage.getItem('brainplay_user_email');

            if (email) {
                return {
                    email,
                    name: getNameFromEmail(email)
                };
            }

            return null;
        }

        async function loginUser(email) {
            if (!email || !email.includes('@')) {
                throw new Error("Valid email required");
            }

            const normalized = email.toLowerCase();
            const userRef = doc(db, USERS_COLLECTION, normalized);
            const userSnap = await getDoc(userRef);

            const todayStr = new Date().toISOString().slice(0,10);

            if (!userSnap.exists()) {

                await setDoc(userRef, {
                    name: getNameFromEmail(normalized),
                    email: normalized,
                    todayPerfectCount: 0,
                    allTimePerfectCount: 0,
                    lastResetDate: todayStr,
                    createdAt: new Date().toISOString()
                });

            } else {

                const existing = userSnap.data();

                if (existing.lastResetDate !== todayStr) {
                    await updateDoc(userRef, {
                        todayPerfectCount: 0,
                        lastResetDate: todayStr
                    });
                }
            }

            localStorage.setItem('brainplay_user_email', normalized);

            return {
                email: normalized,
                name: getNameFromEmail(normalized)
            };
        }

        function logoutUser() {
            localStorage.removeItem('brainplay_user_email');
            location.reload();
        }

        window.loginUser = loginUser;
        window.logoutUser = logoutUser;
        window.getCurrentUser = getCurrentUser;
        window.fetchLeaderboardData = fetchLeaderboardData;
        window.seedDemoUsers = seedDemoUsers;
        window.resetTodayCountsIfNeeded = resetTodayCountsIfNeeded;

        window.initLeaderboard = async () => {
            await resetTodayCountsIfNeeded();
            await seedDemoUsers();
            renderLeaderboardUI();
        };

        window.renderLeaderboardUI = async () => {

            const users = await fetchLeaderboardData();
            const currentUser = getCurrentUser();

            const tbody = document.getElementById('leaderboardBody');

            tbody.innerHTML = '';

            users.forEach((user, idx) => {

                const row = document.createElement('tr');

                row.innerHTML = `
                    <td class="rank-cell">#${idx + 1}</td>
                    <td class="name-cell">${user.name}</td>
                    <td class="score-cell">${user.allTimePerfectCount}</td>
                `;

                tbody.appendChild(row);
            });

            const joinBtn = document.getElementById('joinNowBtn');
            const userDisplaySpan = document.getElementById('loggedUserDisplay');

            if (currentUser) {

                if (joinBtn) joinBtn.style.display = 'none';

                if (userDisplaySpan) {
                    userDisplaySpan.style.display = 'inline-flex';

                    userDisplaySpan.innerHTML = `
                        👋 ${currentUser.name}
                        <button id="logoutBtnSmall" class="logout-mini">🚪</button>
                    `;

                    const logoutMini = document.getElementById('logoutBtnSmall');

                    if (logoutMini) {
                        logoutMini.onclick = (e) => {
                            e.stopPropagation();
                            logoutUser();
                        };
                    }
                }

            } else {

                if (joinBtn) joinBtn.style.display = 'flex';

                if (userDisplaySpan) {
                    userDisplaySpan.style.display = 'none';
                }
            }
        };

        window.addEventListener('DOMContentLoaded', async () => {

            await initLeaderboard();

            const modal = document.getElementById('loginModal');
            const joinBtn = document.getElementById('joinNowBtn');
            const closeModal = document.getElementById('closeModal');

            const saveEmailBtn = document.getElementById('saveEmailBtn');
            const emailInput = document.getElementById('loginEmail');

            if (joinBtn) {
                joinBtn.addEventListener('click', () => {
                    modal.style.display = 'flex';
                });
            }

            if (closeModal) {
                closeModal.addEventListener('click', () => {
                    modal.style.display = 'none';
                });
            }

            if (saveEmailBtn && emailInput) {

                saveEmailBtn.addEventListener('click', async () => {

                    const email = emailInput.value.trim();

                    if (!email || !email.includes('@')) {
                        alert("Please enter valid email");
                        return;
                    }

                    try {

                        await loginUser(email);

                        modal.style.display = 'none';

                        emailInput.value = '';

                        renderLeaderboardUI();

                    } catch(err) {
                        alert(err.message);
                    }
                });
            }

            window.onclick = (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            };
        });
    </script>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Inter',sans-serif;
        }

        body{
            background:#0a0a1a;
            min-height:100vh;
            display:flex;
            justify-content:center;
            padding:20px;
        }

        .leaderboard-container{
            max-width:550px;
            width:100%;
            background:rgba(18,18,40,0.85);
            border-radius:32px;
            padding:20px;
            border:1px solid rgba(255,255,255,0.08);
        }

        .leaderboard-header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .title-section h1{
            font-size:28px;
            font-weight:800;
            color:#fff;
        }

        .title-section p{
            color:#aaa;
            margin-top:4px;
            font-size:13px;
        }

        .hamburger-icon{
            width:44px;
            height:44px;
            border:none;
            border-radius:50%;
            background:#1d1d38;
            color:white;
            cursor:pointer;
            font-size:24px;
        }

        .dropdown-menu{
            display:none;
        }

        .user-action-area{
            background:#101020;
            padding:10px 14px;
            border-radius:60px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:20px;
        }

        .check-rank-text{
            color:#ddd;
            font-size:14px;
        }

        .join-now-btn{
            background:#FDDA0D;
            border:none;
            padding:10px 18px;
            border-radius:40px;
            font-weight:800;
            cursor:pointer;
        }

        .search-box{
            background:#12122c;
            border-radius:40px;
            padding:12px 16px;
            margin-bottom:20px;
        }

        .search-box input{
            width:100%;
            background:transparent;
            border:none;
            color:white;
            outline:none;
        }

        .leaderboard-table{
            width:100%;
            border-collapse:collapse;
        }

        .leaderboard-table th{
            padding:14px 6px;
            text-align:left;
            color:#facc15;
            border-bottom:1px solid #2d2d4c;
        }

        .leaderboard-table td{
            padding:14px 6px;
            color:white;
            border-bottom:1px solid #1d1d35;
        }

        .score-cell{
            text-align:right;
            color:#FFD966;
        }

        .play-again-wrapper{
            display:flex;
            justify-content:center;
            margin-top:24px;
        }

        .play-again-btn{
            background:#FDDA0D;
            border:none;
            padding:12px 24px;
            border-radius:40px;
            font-weight:800;
            cursor:pointer;
        }

        /* ========================= */
        /* MODAL */
        /* ========================= */

        .modal{
            display:none;
            position:fixed;
            inset:0;
            background:rgba(0,0,0,0.85);
            backdrop-filter:blur(8px);
            justify-content:center;
            align-items:center;
            z-index:999;
        }

        .modal-card{
            background:#16162e;
            width:90%;
            max-width:340px;
            border-radius:34px;
            padding:34px 24px 28px;
            position:relative;
            border:1px solid rgba(255,215,0,0.55);
        }

        /* ONLY SMALL WHITE X */
        .modal-close{
            position:absolute;
            top:14px;
            right:18px;
            background:none;
            border:none;
            color:#ffffff;
            font-size:22px;
            cursor:pointer;
            line-height:1;
            padding:0;
            width:auto;
            height:auto;
            font-weight:400;
        }

        .modal-card h3{
            color:white;
            font-size:28px;
            margin-bottom:8px;
        }

        .modal-card p{
            color:#cfcfcf;
            font-size:14px;
            margin-bottom:18px;
        }

        .modal-card input{
            width:100%;
            border:none;
            outline:none;
            background:#252545;
            color:white;
            padding:15px 16px;
            border-radius:50px;
            margin-bottom:20px;
            font-size:15px;
        }

        .modal-card input::placeholder{
            color:#8f8fae;
        }

        .modal-card button:not(.modal-close){
            width:100%;
            border:none;
            background:#FDDA0D;
            color:#000;
            font-weight:800;
            padding:14px;
            border-radius:50px;
            font-size:16px;
            cursor:pointer;
        }

        @media(max-width:480px){

            .leaderboard-container{
                padding:16px;
            }

            .title-section h1{
                font-size:24px;
            }
        }

    </style>
</head>

<body>

<div class="leaderboard-container">

    <div class="leaderboard-header">

        <div class="title-section">
            <h1>🏆 LEADERBOARD</h1>
            <p>Top players • Real vs AI challenge</p>
        </div>

        <button class="hamburger-icon">☰</button>

    </div>

    <div class="user-action-area">

        <span class="check-rank-text">👑 Check your rank</span>

        <button id="joinNowBtn" class="join-now-btn">
            🔗 Join Now
        </button>

        <span id="loggedUserDisplay" style="display:none;"></span>

    </div>

    <div class="search-box">
        <input type="text" placeholder="Search player..." id="searchInput">
    </div>

    <table class="leaderboard-table">

        <thead>
            <tr>
                <th>Rank</th>
                <th>Player</th>
                <th style="text-align:right;">Score</th>
            </tr>
        </thead>

        <tbody id="leaderboardBody">
            <tr>
                <td colspan="3" style="text-align:center;padding:30px;">
                    Loading leaderboard...
                </td>
            </tr>
        </tbody>

    </table>

    <div class="play-again-wrapper">
        <button class="play-again-btn" id="playAgainBtn">
            ▶ Play
        </button>
    </div>

</div>

<!-- LOGIN MODAL -->
<div id="loginModal" class="modal">

    <div class="modal-card">

        <!-- SMALL WHITE X ONLY -->
        <button class="modal-close" id="closeModal">×</button>

        <h3>✨ Join Now</h3>

        <p>Enter your email to compete on leaderboard</p>

        <input
            type="email"
            id="loginEmail"
            placeholder="you@example.com"
            autocomplete="email"
        >

        <button id="saveEmailBtn">
            Save & Continue
        </button>

    </div>

</div>

<script type="module">

    const playAgain = document.getElementById('playAgainBtn');

    if (playAgain) {
        playAgain.addEventListener('click', () => {
            window.location.href = 'index.html';
        });
    }

</script>

</body>
</html>
